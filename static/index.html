<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Prompt 管理器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 左上角主题切换按钮 -->
    <a href="#" class="theme-toggle" id="themeToggle" title="切换主题">
        <svg width="80" height="80" viewBox="0 0 250 250" style="color:#fff; position: absolute; top: 0; border: 0; left: 0;" aria-hidden="true">
            <path d="M0,0 L250,0 L0,250 Z"></path>
            <text x="35" y="75" fill="white" font-size="50" font-family="Arial" font-weight="bold">☀</text>
        </svg>
    </a>
    <!-- 右上角GitHub链接 -->
    <a href="https://github.com/chenxuan520/llm_prompt" class="github-link" target="_blank" title="GitHub仓库">
        <svg width="80" height="80" viewBox="0 0 250 250" style="color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
        </svg>
    </a>

    <!-- 右下角强制刷新缓存按钮 -->
    <button class="refresh-cache-btn" id="refreshCacheBtn" title="强制刷新缓存">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4.01 7.58 4.01 12C4.01 16.42 7.58 20 12 20C15.73 20 18.84 17.45 19.73 14H17.65C16.83 16.33 14.61 18 12 18C8.69 18 6 15.31 6 12C6 8.69 8.69 6 12 6C13.66 6 15.14 6.69 16.22 7.78L13 11H20V4L17.65 6.35Z" fill="currentColor"/>
        </svg>
    </button>
    <div class="header">
        <h1>LLM Prompt 管理器</h1>
        <p>点击复制按钮复制提示词，使用搜索框筛选提示词</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索提示词...">
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- 卡片将通过 data.js 动态生成 -->
    </div>

    <!-- 加载数据和主要功能脚本 -->
    <script src="data.js"></script>
    <script src="script.js"></script>
    
    <!-- 动态生成卡片的脚本 -->
    <script>
        // 页面加载完成后生成卡片
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof promptData !== 'undefined' && promptData.length > 0) {
                const container = document.getElementById('cardsContainer');
                
                promptData.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-title', item.title);
                    card.setAttribute('data-filename', item.filename);
                    card.setAttribute('data-content', item.content);
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-title">${item.title}</div>
                            <button class="copy-btn" onclick="copyToClipboard(this)">复制</button>
                        </div>
                        <div class="card-body">
                            <div class="markdown-content">${simpleMarkdownToHtml(item.preview)}</div>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
                
                // 初始化搜索功能
                setTimeout(initSearch, 100); // 延迟执行确保DOM已完全加载
            }
        });
    </script>
</body>
</html>
